services:
  - type: web
    name: miniproject-backend
    env: node
    buildCommand: npm install && npm run build --prefix frontend && npm install --prefix backend
    startCommand: npm start --prefix backend
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: PORT
        value: 5000
    rootDir: .
